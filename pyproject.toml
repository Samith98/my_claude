[project]
name = "my-code"
version = "0.1.0"
description = ""
authors = [
    {name = "Samith98",email = "s.samith@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "langchain (>=1.4.2,<2.0.0)",
    "langchain-openai (>=1.6.6,<2.0.0)",
    "langgraph (>=1.2.12,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)"
]

[tool.poetry]
packages = [{include = "my_code", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
